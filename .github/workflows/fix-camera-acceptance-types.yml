name: Fix camera acceptance types

on:
  push:
    branches:
      - planning/rvtt-remake
    paths:
      - .github/workflows/fix-camera-acceptance-types.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out planning branch
        uses: actions/checkout@v4
        with:
          ref: planning/rvtt-remake
          fetch-depth: 0

      - name: Add explicit camera requirement types
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("implementation/roblox/tests/WorldTokenAcceptance/WorldTokenAcceptance.client.lua")
          text = path.read_text(encoding="utf-8")
          old = "\tlocal requirements = {"
          new = "\tlocal requirements: { [string]: string } = {"
          if text.count(old) != 1:
              raise SystemExit("camera requirements anchor missing or ambiguous")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          rm -f .github/workflows/fix-camera-acceptance-types.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: type camera acceptance requirements"
          git push origin HEAD:planning/rvtt-remake