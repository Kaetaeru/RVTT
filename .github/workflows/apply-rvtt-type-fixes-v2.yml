name: Apply RVTT type fixes v2

on:
  push:
    branches:
      - planning/rvtt-remake
    paths:
      - ".github/workflows/apply-rvtt-type-fixes-v2.yml"

permissions:
  contents: write

env:
  STYLUA_VERSION: "2.5.2"
  PATCH_COMMIT: "6ec5714cc5820a6e0b521a235862dadf390fb29e"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: planning/rvtt-remake
          fetch-depth: 0

      - name: Restore StyLua
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/stylua
            ~/.cargo/registry
            ~/.cargo/git
          key: rvtt-tools-v5-${{ runner.os }}-rojo-7.6.1-stylua-${{ env.STYLUA_VERSION }}-selene-0.31.0-luau-lsp-1.69.0
          restore-keys: |
            rvtt-tools-v5-${{ runner.os }}-

      - name: Install StyLua if needed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v stylua >/dev/null 2>&1; then
            cargo install stylua --version "${STYLUA_VERSION}" --features luau --locked
          fi

      - name: Apply patch to the Roblox project root
        shell: bash
        run: |
          set -euo pipefail
          for part in 00 01 02 03 04 05; do
            git show "${PATCH_COMMIT}:.github/rvtt-type-fixes/part${part}"
          done > /tmp/rvtt-type-fixes.patch.gz.b64
          base64 --decode /tmp/rvtt-type-fixes.patch.gz.b64 | gzip --decompress > /tmp/rvtt-type-fixes.patch
          git apply --directory=implementation/roblox /tmp/rvtt-type-fixes.patch
          stylua implementation/roblox/src implementation/roblox/tests

      - name: Commit fixes and remove applicator
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-rvtt-type-fixes-v2.yml
          git add implementation/roblox/src implementation/roblox/tests
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: apply Luau type boundary corrections"
          git push origin HEAD:planning/rvtt-remake
