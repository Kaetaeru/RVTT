name: Validate RVTT implementation planning boundary

concurrency:
  group: rvtt-model-reset-boundary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "AGENTS-PLANNING-ADDENDUM.md"
      - "AGENT-TEST-STATUS.md"
      - ".github/README.md"
      - ".github/CODEX-ACTIVE-TASK.md"
      - ".github/workflows/validate-greenfield-boundary.yml"
      - "docs/remake/README.md"
      - "docs/remake/CURRENT-WORK-ORDER.md"
      - "docs/remake/product/codex-supervised-review-and-test-policy.md"
      - "docs/remake/specs/README.md"
      - "docs/remake/specs/CURRENT-SPEC-WORK-ORDER.md"
      - "implementation/roblox/README.md"
      - "implementation/roblox/CURRENT-WORK-ORDER.md"
      - "implementation/roblox/IMPLEMENTATION-STATUS.md"
      - "implementation/roblox/EXECUTION-TEST-RULES.md"
      - "implementation/roblox/ROBLOX-STUDIO-MCP-TEST-POLICY.md"
      - "implementation/roblox/CODEX-REVIEW-TEST-GATE.md"
      - "implementation/roblox/greenfield-boundary.json"
      - "implementation/roblox/greenfield.project.json"
      - "implementation/roblox/IMPLEMENTATION-MODEL.md"
      - "implementation/roblox/SYSTEMS.md"
      - "implementation/roblox/manifests/implementation-system-model.json"
      - "implementation/roblox/manifests/scenario-base-catalog.json"
      - "implementation/roblox/manifests/scenario-expanded-catalog.json"
      - "implementation/roblox/manifests/scenario-semantic-audit.json"
      - "implementation/roblox/manifests/scenario-semantic-audit-v3.json"
      - "implementation/roblox/MODULE-CONTRACTS.md"
      - "implementation/roblox/SYSTEM-FUNCTION-CONTRACTS.md"
      - "implementation/roblox/GREENFIELD-EXECUTION-LAYERS.md"
      - "implementation/roblox/GREENFIELD-SYSTEM-SEQUENCE.md"
      - "implementation/roblox/manifests/module-contracts.json"
      - "implementation/roblox/manifests/system-function-contracts.json"
      - "implementation/roblox/manifests/execution-layers.json"
      - "implementation/roblox/tooling/validate_greenfield_boundary.py"
      - "implementation/roblox/tooling/validate_module_contracts.py"
      - "implementation/roblox/tooling/validate_execution_layers.py"
      - "implementation/roblox/src/**"
      - "implementation/roblox/default.project.json"
  push:
    branches:
      - main
      - planning/rvtt-remake
    paths:
      - "AGENTS.md"
      - "AGENTS-PLANNING-ADDENDUM.md"
      - "AGENT-TEST-STATUS.md"
      - ".github/README.md"
      - ".github/CODEX-ACTIVE-TASK.md"
      - ".github/workflows/validate-greenfield-boundary.yml"
      - "docs/remake/README.md"
      - "docs/remake/CURRENT-WORK-ORDER.md"
      - "docs/remake/product/codex-supervised-review-and-test-policy.md"
      - "docs/remake/specs/README.md"
      - "docs/remake/specs/CURRENT-SPEC-WORK-ORDER.md"
      - "implementation/roblox/README.md"
      - "implementation/roblox/CURRENT-WORK-ORDER.md"
      - "implementation/roblox/IMPLEMENTATION-STATUS.md"
      - "implementation/roblox/EXECUTION-TEST-RULES.md"
      - "implementation/roblox/ROBLOX-STUDIO-MCP-TEST-POLICY.md"
      - "implementation/roblox/CODEX-REVIEW-TEST-GATE.md"
      - "implementation/roblox/greenfield-boundary.json"
      - "implementation/roblox/greenfield.project.json"
      - "implementation/roblox/IMPLEMENTATION-MODEL.md"
      - "implementation/roblox/SYSTEMS.md"
      - "implementation/roblox/manifests/implementation-system-model.json"
      - "implementation/roblox/manifests/scenario-base-catalog.json"
      - "implementation/roblox/manifests/scenario-expanded-catalog.json"
      - "implementation/roblox/manifests/scenario-semantic-audit.json"
      - "implementation/roblox/manifests/scenario-semantic-audit-v3.json"
      - "implementation/roblox/MODULE-CONTRACTS.md"
      - "implementation/roblox/SYSTEM-FUNCTION-CONTRACTS.md"
      - "implementation/roblox/GREENFIELD-EXECUTION-LAYERS.md"
      - "implementation/roblox/GREENFIELD-SYSTEM-SEQUENCE.md"
      - "implementation/roblox/manifests/module-contracts.json"
      - "implementation/roblox/manifests/system-function-contracts.json"
      - "implementation/roblox/manifests/execution-layers.json"
      - "implementation/roblox/tooling/validate_greenfield_boundary.py"
      - "implementation/roblox/tooling/validate_module_contracts.py"
      - "implementation/roblox/tooling/validate_execution_layers.py"
      - "implementation/roblox/src/**"
      - "implementation/roblox/default.project.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate current planning boundary and legacy write lock
        run: python implementation/roblox/tooling/validate_greenfield_boundary.py

      - name: Validate retired module and stable-function registries
        run: python implementation/roblox/tooling/validate_module_contracts.py

      - name: Validate current execution semantics
        run: python implementation/roblox/tooling/validate_execution_layers.py
