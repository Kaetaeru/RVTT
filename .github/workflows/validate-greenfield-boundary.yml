name: Validate RVTT greenfield boundary

concurrency:
  group: rvtt-greenfield-boundary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/CODEX-ACTIVE-TASK.md"
      - ".github/CODEX-STUDIO-GREENFIELD-FOUNDATION-EXPLORATION-001.md"
      - ".github/workflows/validate-greenfield-boundary.yml"
      - "implementation/roblox/GREENFIELD-PREFLIGHT.md"
      - "implementation/roblox/GREENFIELD-BUILD-POLICY.md"
      - "implementation/roblox/GREENFIELD-SYSTEM-SEQUENCE.md"
      - "implementation/roblox/ROBLOX-STUDIO-MCP-TEST-POLICY.md"
      - "implementation/roblox/greenfield-boundary.json"
      - "implementation/roblox/greenfield.project.json"
      - "implementation/roblox/greenfield/**"
      - "implementation/roblox/manifests/module-contracts.json"
      - "implementation/roblox/tooling/validate_greenfield_boundary.py"
      - "implementation/roblox/tooling/validate_module_contracts.py"
      - "implementation/roblox/src/**"
      - "implementation/roblox/default.project.json"
  push:
    branches:
      - main
      - planning/rvtt-remake
    paths:
      - "AGENTS.md"
      - ".github/CODEX-ACTIVE-TASK.md"
      - ".github/CODEX-STUDIO-GREENFIELD-FOUNDATION-EXPLORATION-001.md"
      - ".github/workflows/validate-greenfield-boundary.yml"
      - "implementation/roblox/GREENFIELD-PREFLIGHT.md"
      - "implementation/roblox/GREENFIELD-BUILD-POLICY.md"
      - "implementation/roblox/GREENFIELD-SYSTEM-SEQUENCE.md"
      - "implementation/roblox/ROBLOX-STUDIO-MCP-TEST-POLICY.md"
      - "implementation/roblox/greenfield-boundary.json"
      - "implementation/roblox/greenfield.project.json"
      - "implementation/roblox/greenfield/**"
      - "implementation/roblox/manifests/module-contracts.json"
      - "implementation/roblox/tooling/validate_greenfield_boundary.py"
      - "implementation/roblox/tooling/validate_module_contracts.py"
      - "implementation/roblox/src/**"
      - "implementation/roblox/default.project.json"
  workflow_dispatch:

permissions:
  contents: read

env:
  ROJO_VERSION: "7.7.0"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Greenfield boundary and Legacy lock
        run: python implementation/roblox/tooling/validate_greenfield_boundary.py

      - name: Validate Greenfield module contracts
        run: python implementation/roblox/tooling/validate_module_contracts.py

      - name: Restore pinned Rojo
        id: rojo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/rojo
            ~/.cargo/registry
            ~/.cargo/git
          key: rvtt-greenfield-rojo-${{ runner.os }}-${{ env.ROJO_VERSION }}

      - name: Install pinned Rojo
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rojo >/dev/null 2>&1; then
            cargo install rojo --version "${ROJO_VERSION}" --locked
          fi
          rojo --version

      - name: Save pinned Rojo
        if: steps.rojo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/bin/rojo
            ~/.cargo/registry
            ~/.cargo/git
          key: rvtt-greenfield-rojo-${{ runner.os }}-${{ env.ROJO_VERSION }}

      - name: Build isolated Greenfield place
        working-directory: implementation/roblox
        run: rojo build greenfield.project.json --output "${RUNNER_TEMP}/RVTT-greenfield.rbxlx"
