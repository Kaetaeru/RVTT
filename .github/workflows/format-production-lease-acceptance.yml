name: Format production lease acceptance

on:
  push:
    branches:
      - planning/rvtt-remake
    paths:
      - "implementation/roblox/src/ServerScriptService/RVTT/ServerBoot.server.lua"
      - "implementation/roblox/tests/ProductionLeaseAcceptance/**"
      - ".github/workflows/format-production-lease-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: planning/rvtt-remake
          fetch-depth: 0

      - name: Install StyLua
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v stylua >/dev/null 2>&1; then
            cargo install stylua --version 2.5.2 --features luau --locked
          fi

      - name: Format production lease acceptance
        shell: bash
        working-directory: implementation/roblox
        run: |
          stylua \
            src/ServerScriptService/RVTT/ServerBoot.server.lua \
            tests/ProductionLeaseAcceptance/ClientRunner.client.lua \
            tests/ProductionLeaseAcceptance/ServerRunner.server.lua

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add implementation/roblox/src/ServerScriptService/RVTT/ServerBoot.server.lua \
            implementation/roblox/tests/ProductionLeaseAcceptance
          git commit -m "format production lease acceptance"
          git pull --rebase origin planning/rvtt-remake
          git push origin HEAD:planning/rvtt-remake
