name: Validate RVTT implementation system model

concurrency:
  group: rvtt-implementation-model-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/CODEX-ACTIVE-TASK.md"
      - ".github/workflows/validate-module-contracts.yml"
      - "implementation/roblox/IMPLEMENTATION-MODEL.md"
      - "implementation/roblox/SYSTEMS.md"
      - "implementation/roblox/ARCHITECTURE-COVERAGE-POLICY.md"
      - "implementation/roblox/MODULE-CONTRACTS.md"
      - "implementation/roblox/SYSTEM-FUNCTION-CONTRACTS.md"
      - "implementation/roblox/GREENFIELD-EXECUTION-LAYERS.md"
      - "implementation/roblox/GREENFIELD-SYSTEM-SEQUENCE.md"
      - "implementation/roblox/audits/IMPLEMENTATION-MODEL-R2-SCENARIO-PRESSURE-001.md"
      - "implementation/roblox/audits/IMPLEMENTATION-MODEL-R3-BOUNDARY-001.md"
      - "implementation/roblox/manifests/architecture-coverage.json"
      - "implementation/roblox/manifests/architecture-scenarios.json"
      - "implementation/roblox/manifests/implementation-system-model.json"
      - "implementation/roblox/manifests/module-contracts.json"
      - "implementation/roblox/manifests/system-function-contracts.json"
      - "implementation/roblox/manifests/execution-layers.json"
      - "implementation/roblox/tooling/validate_architecture_coverage.py"
      - "implementation/roblox/tooling/validate_module_contracts.py"
      - "implementation/roblox/tooling/validate_execution_layers.py"
  push:
    branches:
      - planning/rvtt-remake
    paths:
      - "AGENTS.md"
      - ".github/CODEX-ACTIVE-TASK.md"
      - "implementation/roblox/IMPLEMENTATION-MODEL.md"
      - "implementation/roblox/SYSTEMS.md"
      - "implementation/roblox/ARCHITECTURE-COVERAGE-POLICY.md"
      - "implementation/roblox/MODULE-CONTRACTS.md"
      - "implementation/roblox/SYSTEM-FUNCTION-CONTRACTS.md"
      - "implementation/roblox/GREENFIELD-EXECUTION-LAYERS.md"
      - "implementation/roblox/GREENFIELD-SYSTEM-SEQUENCE.md"
      - "implementation/roblox/audits/IMPLEMENTATION-MODEL-R2-SCENARIO-PRESSURE-001.md"
      - "implementation/roblox/audits/IMPLEMENTATION-MODEL-R3-BOUNDARY-001.md"
      - "implementation/roblox/manifests/architecture-coverage.json"
      - "implementation/roblox/manifests/architecture-scenarios.json"
      - "implementation/roblox/manifests/implementation-system-model.json"
      - "implementation/roblox/manifests/module-contracts.json"
      - "implementation/roblox/manifests/system-function-contracts.json"
      - "implementation/roblox/manifests/execution-layers.json"
      - "implementation/roblox/tooling/validate_architecture_coverage.py"
      - "implementation/roblox/tooling/validate_module_contracts.py"
      - "implementation/roblox/tooling/validate_execution_layers.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repaired system requirement and scenario coverage
        run: python implementation/roblox/tooling/validate_architecture_coverage.py

      - name: Validate retired module and stable-function registries
        run: python implementation/roblox/tooling/validate_module_contracts.py

      - name: Validate execution semantics and preserved process rules
        run: python implementation/roblox/tooling/validate_execution_layers.py
