name: Apply RVTT type fixes

on:
  push:
    branches:
      - planning/rvtt-remake
    paths:
      - ".github/workflows/apply-rvtt-type-fixes.yml"

permissions:
  contents: write

env:
  STYLUA_VERSION: "2.5.2"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: planning/rvtt-remake
          fetch-depth: 0

      - name: Restore StyLua
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/stylua
            ~/.cargo/registry
            ~/.cargo/git
          key: rvtt-tools-v5-${{ runner.os }}-rojo-7.6.1-stylua-${{ env.STYLUA_VERSION }}-selene-0.31.0-luau-lsp-1.69.0
          restore-keys: |
            rvtt-tools-v5-${{ runner.os }}-

      - name: Install StyLua if needed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v stylua >/dev/null 2>&1; then
            cargo install stylua --version "${STYLUA_VERSION}" --features luau --locked
          fi

      - name: Apply and format type boundary fixes
        shell: bash
        run: |
          set -euo pipefail
          cat .github/rvtt-type-fixes/part* > /tmp/rvtt-type-fixes.patch.gz.b64
          base64 --decode /tmp/rvtt-type-fixes.patch.gz.b64 | gzip --decompress > /tmp/rvtt-type-fixes.patch
          cd implementation/roblox
          git apply /tmp/rvtt-type-fixes.patch
          stylua src tests

      - name: Commit fixes and remove temporary applicator
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-rvtt-type-fixes.yml
          git rm -r .github/rvtt-type-fixes
          git add implementation/roblox/src implementation/roblox/tests
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: resolve Luau type boundary errors"
          git push origin HEAD:planning/rvtt-remake
