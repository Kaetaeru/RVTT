name: Execute RVTT implementation bootstrap

on:
  push:
    branches:
      - planning/rvtt-remake
    paths:
      - ".github/workflows/execute-rvtt-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Check out planning branch
        uses: actions/checkout@v4
        with:
          ref: planning/rvtt-remake
          fetch-depth: 0

      - name: Extract embedded implementation payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, tarfile

          source = Path('.github/workflows/bootstrap-rvtt-all-slices.yml').read_text(encoding='utf-8')
          start = source.index('H4sI')
          end = source.index("\n          PAYLOAD", start)
          encoded = ''.join(source[start:end].split())
          payload = base64.b64decode(encoded)
          digest = hashlib.sha256(payload).hexdigest()
          expected = '0d561f90d7d9539f81801892e15957079c5323c5117728910d0d8212c21a3d46'
          if digest != expected:
              raise SystemExit(f'payload checksum mismatch: {digest}')
          archive = Path('/tmp/rvtt_payload.tar.gz')
          archive.write_bytes(payload)
          with tarfile.open(archive, 'r:gz') as bundle:
              bundle.extractall('.')
          PY

      - name: Validate generated source
        run: python implementation/roblox/tooling/validate_implementation.py

      - name: Commit all-slice implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add implementation/roblox docs/remake/audits/all-slice-script-transfer-audit.md .github/workflows/validate-rvtt-implementation.yml
          if git diff --cached --quiet; then
            echo "Generated implementation already matches the branch."
            exit 0
          fi
          git commit -m "feat: implement all RVTT slice contracts"
          git push origin HEAD:planning/rvtt-remake
