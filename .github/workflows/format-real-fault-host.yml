name: Format real fault host

on:
  push:
    branches:
      - planning/rvtt-remake
    paths:
      - "implementation/roblox/src/ServerScriptService/RVTT/Server/Persistence/PersistenceCoordinator.lua"
      - "implementation/roblox/tests/RealTransport/ClientRunner.client.lua"
      - "implementation/roblox/tests/RealTransport/ServerRunner.server.lua"
      - "implementation/roblox/tests/RestartAcceptance/ServerRunner.server.lua"
      - "implementation/roblox/tests/Unit/PersistenceRetry.spec.lua"
      - ".github/workflows/format-real-fault-host.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: planning/rvtt-remake
          fetch-depth: 0

      - name: Install StyLua
        shell: bash
        run: |
          if ! command -v stylua >/dev/null 2>&1; then
            cargo install stylua --version 2.5.2 --features luau --locked
          fi

      - name: Format real fault host
        shell: bash
        working-directory: implementation/roblox
        run: |
          stylua \
            src/ServerScriptService/RVTT/Server/Persistence/PersistenceCoordinator.lua \
            tests/RealTransport/ClientRunner.client.lua \
            tests/RealTransport/ServerRunner.server.lua \
            tests/RestartAcceptance/ServerRunner.server.lua \
            tests/Unit/PersistenceRetry.spec.lua

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add implementation/roblox/src implementation/roblox/tests
          git commit -m "format real fault host"
          git pull --rebase origin planning/rvtt-remake
          git push origin HEAD:planning/rvtt-remake
