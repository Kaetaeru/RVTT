name: Format fault host

on:
  push:
    branches:
      - planning/rvtt-remake
    paths:
      - "implementation/roblox/src/StarterPlayer/StarterPlayerScripts/RVTT/Client/ProjectionReplica.lua"
      - "implementation/roblox/src/StarterPlayer/StarterPlayerScripts/RVTT/Client/CommandClient.lua"
      - "implementation/roblox/tests/TestRunner.server.lua"
      - "implementation/roblox/tests/Integration/FaultTransport.lua"
      - "implementation/roblox/tests/Integration/FaultStore.lua"
      - "implementation/roblox/tests/Integration/GrandNetworkFaultHost.spec.lua"
      - "implementation/roblox/tests/Integration/GrandStorageFaultHost.spec.lua"
      - ".github/workflows/format-fault-host.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: planning/rvtt-remake
          fetch-depth: 0

      - name: Install StyLua
        shell: bash
        run: |
          if ! command -v stylua >/dev/null 2>&1; then
            cargo install stylua --version 2.5.2 --features luau --locked
          fi

      - name: Format fault host
        shell: bash
        working-directory: implementation/roblox
        run: |
          stylua \
            src/StarterPlayer/StarterPlayerScripts/RVTT/Client/ProjectionReplica.lua \
            src/StarterPlayer/StarterPlayerScripts/RVTT/Client/CommandClient.lua \
            tests/TestRunner.server.lua \
            tests/Integration/FaultTransport.lua \
            tests/Integration/FaultStore.lua \
            tests/Integration/GrandNetworkFaultHost.spec.lua \
            tests/Integration/GrandStorageFaultHost.spec.lua

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add implementation/roblox/src implementation/roblox/tests
          git commit -m "format Grand fault host"
          git pull --rebase origin planning/rvtt-remake
          git push origin HEAD:planning/rvtt-remake
