name: Format grand harness

on:
  push:
    branches:
      - planning/rvtt-remake
    paths:
      - "implementation/roblox/tests/TestRunner.server.lua"
      - "implementation/roblox/tests/Integration/Slice05Character.spec.lua"
      - "implementation/roblox/tests/Integration/Slice06Inventory.spec.lua"
      - "implementation/roblox/tests/Integration/Slice07TimeProgression.spec.lua"
      - ".github/workflows/format-grand-harness.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: planning/rvtt-remake
          fetch-depth: 0

      - name: Install StyLua
        shell: bash
        run: |
          if ! command -v stylua >/dev/null 2>&1; then
            cargo install stylua --version 2.5.2 --features luau --locked
          fi

      - name: Format grand harness
        shell: bash
        working-directory: implementation/roblox
        run: |
          stylua \
            tests/TestRunner.server.lua \
            tests/Integration/Slice05Character.spec.lua \
            tests/Integration/Slice06Inventory.spec.lua \
            tests/Integration/Slice07TimeProgression.spec.lua

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add implementation/roblox/tests
          git commit -m "format Slices 05 through 07 grand scenarios"
          git push origin HEAD:planning/rvtt-remake
