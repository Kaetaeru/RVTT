name: Bootstrap RVTT all slices

on:
  push:
    branches:
      - planning/rvtt-remake
    paths:
      - ".github/workflows/bootstrap-rvtt-all-slices.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out planning branch
        uses: actions/checkout@v4
        with:
          ref: planning/rvtt-remake
          fetch-depth: 0

      - name: Decode generated implementation
        shell: bash
        run: |
          cat > /tmp/rvtt_payload.b64 <<'PAYLOAD'

          PAYLOAD
          base64 --decode /tmp/rvtt_payload.b64 > /tmp/rvtt_payload.tar.gz
          echo "0d561f90d7d9539f81801892e15957079c5323c5117728910d0d8212c21a3d46  /tmp/rvtt_payload.tar.gz" | sha256sum --check
          tar -xzf /tmp/rvtt_payload.tar.gz -C "$GITHUB_WORKSPACE"

      - name: Validate generated source
        run: python implementation/roblox/tooling/validate_implementation.py

      - name: Commit generated implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add implementation/roblox docs/remake/audits/all-slice-script-transfer-audit.md .github/workflows/validate-rvtt-implementation.yml
          if git diff --cached --quiet; then
            echo "Generated implementation already matches the branch."
            exit 0
          fi
          git commit -m "feat: implement all RVTT slice contracts"
          git push origin HEAD:planning/rvtt-remake
