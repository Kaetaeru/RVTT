name: Format RVTT Once

on:
  push:
    branches:
      - planning/rvtt-remake
    paths:
      - ".github/workflows/format-rvtt-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out planning branch
        uses: actions/checkout@v4
        with:
          ref: planning/rvtt-remake

      - name: Install pinned StyLua
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v stylua >/dev/null 2>&1; then
            cargo install stylua --version "2.5.2" --features luau --locked
          fi

      - name: Format RVTT Luau
        run: stylua implementation/roblox/src implementation/roblox/tests

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add implementation/roblox/src implementation/roblox/tests
          git commit -m "style: format Slice 01 acceptance harness"
          git push origin HEAD:planning/rvtt-remake
