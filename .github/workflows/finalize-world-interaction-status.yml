name: Finalize world interaction status

on:
  push:
    branches:
      - planning/rvtt-remake
    paths:
      - .github/workflows/finalize-world-interaction-status.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: planning/rvtt-remake
          fetch-depth: 0
      - name: Update status documents
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 --decode > /tmp/finalize-status.py
          python /tmp/finalize-status.py
          rm -f .github/workflows/finalize-world-interaction-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: mark world interaction batch Studio pending"
          git push origin HEAD:planning/rvtt-remake
