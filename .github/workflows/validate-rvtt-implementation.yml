name: Validate RVTT implementation

on:
  pull_request:
    paths:
      - "implementation/roblox/**"
      - ".github/workflows/validate-rvtt-implementation.yml"
  push:
    branches:
      - planning/rvtt-remake
    paths:
      - "implementation/roblox/**"
      - ".github/workflows/validate-rvtt-implementation.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ROJO_VERSION: "7.6.1"
  STYLUA_VERSION: "2.5.2"
  SELENE_VERSION: "0.31.0"

jobs:
  structure-and-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate implementation structure and policies
        run: python implementation/roblox/tooling/validate_implementation.py

  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache pinned Rust tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/rojo
            ~/.cargo/bin/stylua
            ~/.cargo/bin/selene
            ~/.cargo/registry
            ~/.cargo/git
          key: rvtt-rust-tools-v2-${{ runner.os }}-rojo-${{ env.ROJO_VERSION }}-stylua-${{ env.STYLUA_VERSION }}-selene-${{ env.SELENE_VERSION }}
          save-always: true

      - name: Install pinned Roblox toolchain
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rojo >/dev/null 2>&1; then
            cargo install rojo --version "${ROJO_VERSION}" --locked
          fi
          if ! command -v stylua >/dev/null 2>&1; then
            cargo install stylua --version "${STYLUA_VERSION}" --features luau --locked
          fi
          if ! command -v selene >/dev/null 2>&1; then
            cargo install selene --version "${SELENE_VERSION}" --locked
          fi
          rojo --version
          stylua --version
          selene --version

      - name: Check Luau formatting
        working-directory: implementation/roblox
        run: stylua --check src tests

      - name: Lint Luau source
        working-directory: implementation/roblox
        run: selene src tests

      - name: Build production place with Rojo
        working-directory: implementation/roblox
        run: rojo build default.project.json --output /tmp/RVTT.rbxlx

      - name: Build test place with Rojo
        working-directory: implementation/roblox
        run: rojo build test.project.json --output /tmp/RVTT-tests.rbxlx
