name: Validate RVTT implementation

on:
  pull_request:
    paths:
      - "implementation/roblox/**"
      - ".github/workflows/validate-rvtt-implementation.yml"
  push:
    branches:
      - planning/rvtt-remake
    paths:
      - "implementation/roblox/**"
      - ".github/workflows/validate-rvtt-implementation.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ROJO_VERSION: "7.6.1"
  STYLUA_VERSION: "2.5.2"
  SELENE_VERSION: "0.31.0"
  LUAU_LSP_VERSION: "1.69.0"

jobs:
  structure-and-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate implementation structure and policies
        run: python implementation/roblox/tooling/validate_implementation.py

  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache pinned Roblox tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/rojo
            ~/.cargo/bin/stylua
            ~/.cargo/bin/selene
            ~/.cargo/registry
            ~/.cargo/git
            ~/.local/bin/luau-lsp
          key: rvtt-tools-v3-${{ runner.os }}-rojo-${{ env.ROJO_VERSION }}-stylua-${{ env.STYLUA_VERSION }}-selene-${{ env.SELENE_VERSION }}-luau-lsp-${{ env.LUAU_LSP_VERSION }}
          restore-keys: |
            rvtt-rust-tools-v2-${{ runner.os }}-rojo-${{ env.ROJO_VERSION }}-stylua-${{ env.STYLUA_VERSION }}-selene-${{ env.SELENE_VERSION }}

      - name: Install pinned Roblox toolchain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          export PATH="${HOME}/.local/bin:${PATH}"

          if ! command -v rojo >/dev/null 2>&1; then
            cargo install rojo --version "${ROJO_VERSION}" --locked
          fi
          if ! command -v stylua >/dev/null 2>&1; then
            cargo install stylua --version "${STYLUA_VERSION}" --features luau --locked
          fi
          if ! command -v selene >/dev/null 2>&1; then
            cargo install selene --version "${SELENE_VERSION}" --locked
          fi
          if ! command -v luau-lsp >/dev/null 2>&1; then
            release_json="$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/JohnnyMorganz/luau-lsp/releases/tags/${LUAU_LSP_VERSION}")"
            asset_url="$(printf '%s' "${release_json}" | jq -r \
              '.assets[] | select(.name | test("linux-x86_64\\.zip$")) | .browser_download_url' | head -n 1)"
            test -n "${asset_url}" && test "${asset_url}" != "null"
            curl -fsSL "${asset_url}" -o /tmp/luau-lsp.zip
            rm -rf /tmp/luau-lsp
            mkdir -p /tmp/luau-lsp
            unzip -q /tmp/luau-lsp.zip -d /tmp/luau-lsp
            binary="$(find /tmp/luau-lsp -type f -name luau-lsp | head -n 1)"
            test -n "${binary}"
            install -m 755 "${binary}" "${HOME}/.local/bin/luau-lsp"
          fi

          rojo --version
          stylua --version
          selene --version
          luau-lsp --help | head -n 1

      - name: Check Luau formatting
        working-directory: implementation/roblox
        run: stylua --check src tests

      - name: Lint Luau source
        working-directory: implementation/roblox
        run: selene src tests

      - name: Build production place with Rojo
        working-directory: implementation/roblox
        run: rojo build default.project.json --output /tmp/RVTT.rbxlx

      - name: Build test place with Rojo
        working-directory: implementation/roblox
        run: rojo build test.project.json --output /tmp/RVTT-tests.rbxlx

      - name: Generate Rojo sourcemap
        working-directory: implementation/roblox
        run: rojo sourcemap default.project.json --output sourcemap.json

      - name: Download pinned Roblox type definitions
        working-directory: implementation/roblox
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/${LUAU_LSP_VERSION}/scripts/globalTypes.d.luau" \
            -o globalTypes.d.luau

      - name: Analyze Luau types
        working-directory: implementation/roblox
        run: >-
          luau-lsp analyze
          --defs=globalTypes.d.luau
          --sourcemap=sourcemap.json
          --no-strict-dm-types
          src tests
