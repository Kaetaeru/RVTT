name: Validate RVTT implementation

on:
  pull_request:
    paths:
      - "implementation/roblox/**"
      - ".github/workflows/validate-rvtt-implementation.yml"
  push:
    branches:
      - planning/rvtt-remake
    paths:
      - "implementation/roblox/**"
      - ".github/workflows/validate-rvtt-implementation.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  STYLUA_VERSION: "2.5.2"

jobs:
  structure-and-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate implementation structure and policies
        run: python implementation/roblox/tooling/validate_implementation.py

  format-source:
    if: github.event_name == 'push' && github.ref == 'refs/heads/planning/rvtt-remake'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out planning branch
        uses: actions/checkout@v4
        with:
          ref: planning/rvtt-remake
          fetch-depth: 0

      - name: Cache pinned StyLua
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/stylua
            ~/.cargo/registry
            ~/.cargo/git
          key: rvtt-stylua-${{ runner.os }}-${{ env.STYLUA_VERSION }}

      - name: Install pinned StyLua
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v stylua >/dev/null 2>&1; then
            cargo install stylua --version "${STYLUA_VERSION}" --features luau --locked
          fi
          stylua --version

      - name: Format Luau source
        working-directory: implementation/roblox
        run: stylua src tests

      - name: Commit formatted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add implementation/roblox/src implementation/roblox/tests
          if git diff --cached --quiet; then
            echo "Luau source already matches StyLua."
            exit 0
          fi
          git commit -m "style: format RVTT Luau source"
          git push origin HEAD:planning/rvtt-remake
