name: Validate RVTT architecture coverage

concurrency:
  group: rvtt-architecture-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/CODEX-ACTIVE-TASK.md"
      - ".github/workflows/validate-architecture-coverage.yml"
      - "docs/remake/CURRENT-WORK-ORDER.md"
      - "docs/remake/DOCUMENT-ROLE-ACCESS-AUTHORING-RULE.md"
      - "docs/remake/product/**"
      - "docs/remake/decisions/**"
      - "docs/remake/architecture/**"
      - "docs/remake/systems/**"
      - "docs/remake/ui/**"
      - "docs/remake/specs/**"
      - "implementation/roblox/IMPLEMENTATION-MODEL.md"
      - "implementation/roblox/SYSTEMS.md"
      - "implementation/roblox/ARCHITECTURE-COVERAGE-POLICY.md"
      - "implementation/roblox/audits/IMPLEMENTATION-MODEL-R2-SCENARIO-PRESSURE-001.md"
      - "implementation/roblox/audits/IMPLEMENTATION-MODEL-R3-BOUNDARY-001.md"
      - "implementation/roblox/manifests/architecture-coverage.json"
      - "implementation/roblox/manifests/architecture-scenarios.json"
      - "implementation/roblox/manifests/scenario-base-catalog.json"
      - "implementation/roblox/manifests/scenario-expanded-catalog.json"
      - "implementation/roblox/manifests/implementation-system-model.json"
      - "implementation/roblox/manifests/scenario-semantic-audit.json"
      - "implementation/roblox/manifests/scenario-semantic-audit-v3.json"
      - "implementation/roblox/tooling/validate_architecture_coverage.py"
      - "implementation/roblox/tooling/validate_scenario_semantic_audit.py"
  push:
    branches:
      - main
      - planning/rvtt-remake
    paths:
      - "AGENTS.md"
      - ".github/CODEX-ACTIVE-TASK.md"
      - ".github/workflows/validate-architecture-coverage.yml"
      - "docs/remake/CURRENT-WORK-ORDER.md"
      - "docs/remake/DOCUMENT-ROLE-ACCESS-AUTHORING-RULE.md"
      - "docs/remake/product/**"
      - "docs/remake/decisions/**"
      - "docs/remake/architecture/**"
      - "docs/remake/systems/**"
      - "docs/remake/ui/**"
      - "docs/remake/specs/**"
      - "implementation/roblox/IMPLEMENTATION-MODEL.md"
      - "implementation/roblox/SYSTEMS.md"
      - "implementation/roblox/ARCHITECTURE-COVERAGE-POLICY.md"
      - "implementation/roblox/audits/IMPLEMENTATION-MODEL-R2-SCENARIO-PRESSURE-001.md"
      - "implementation/roblox/audits/IMPLEMENTATION-MODEL-R3-BOUNDARY-001.md"
      - "implementation/roblox/manifests/architecture-coverage.json"
      - "implementation/roblox/manifests/architecture-scenarios.json"
      - "implementation/roblox/manifests/scenario-base-catalog.json"
      - "implementation/roblox/manifests/scenario-expanded-catalog.json"
      - "implementation/roblox/manifests/implementation-system-model.json"
      - "implementation/roblox/manifests/scenario-semantic-audit.json"
      - "implementation/roblox/manifests/scenario-semantic-audit-v3.json"
      - "implementation/roblox/tooling/validate_architecture_coverage.py"
      - "implementation/roblox/tooling/validate_scenario_semantic_audit.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repaired system and requirement coverage
        run: python implementation/roblox/tooling/validate_architecture_coverage.py

      - name: Validate clean scenario catalogs and full semantic audit v3
        run: python implementation/roblox/tooling/validate_scenario_semantic_audit.py
