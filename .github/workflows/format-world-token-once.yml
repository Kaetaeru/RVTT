name: Format World Token Once

on:
  push:
    branches:
      - planning/rvtt-remake
    paths:
      - ".github/workflows/format-world-token-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out planning branch
        uses: actions/checkout@v4
        with:
          ref: planning/rvtt-remake

      - name: Install pinned StyLua
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v stylua >/dev/null 2>&1; then
            cargo install stylua --version "2.5.2" --features luau --locked
          fi

      - name: Format world token source
        run: stylua implementation/roblox/src implementation/roblox/tests

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/format-world-token-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add implementation/roblox/src implementation/roblox/tests .github/workflows/format-world-token-once.yml
          git commit -m "style: format 3D world token runtime"
          git push origin HEAD:planning/rvtt-remake
