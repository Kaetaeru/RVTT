name: Format WASD Camera Acceptance

on:
  push:
    paths:
      - .github/workflows/format-wasd-camera-acceptance.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out planning branch
        uses: actions/checkout@v4
        with:
          ref: planning/rvtt-remake
          fetch-depth: 0

      - name: Apply StyLua output
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          camera_path = Path("implementation/roblox/src/StarterPlayer/StarterPlayerScripts/RVTT/Client/World/WorldCameraController.lua")
          camera = camera_path.read_text(encoding="utf-8")
          old_camera = '''\tif\n\t\tnot self.enabled\n\t\tor self.movementModeActive\n\t\tor axis.Magnitude <= 0\n\t\tor deltaTime <= 0\n\tthen\n'''
          new_camera = '\tif not self.enabled or self.movementModeActive or axis.Magnitude <= 0 or deltaTime <= 0 then\n'
          if camera.count(old_camera) != 1:
              raise SystemExit("camera format target mismatch")
          camera_path.write_text(camera.replace(old_camera, new_camera, 1), encoding="utf-8")

          acceptance_path = Path("implementation/roblox/tests/WorldTokenAcceptance/WorldTokenAcceptance.client.lua")
          acceptance = acceptance_path.read_text(encoding="utf-8")
          old_acceptance = '''\tlocal id = if action == "frame"\n\t\tthen "camera-frame"\n\t\telseif action == "pan" and source == "keyboard-wasd"\n\t\tthen "camera-wasd-pan"\n\t\telseif action == "pan"\n\t\tthen "camera-pan"\n\t\telseif action == "zoom"\n\t\tthen "camera-zoom"\n\t\telse nil\n'''
          new_acceptance = '''\tlocal id = if action == "frame"\n\t\tthen "camera-frame"\n\t\telseif action == "pan" and source == "keyboard-wasd" then "camera-wasd-pan"\n\t\telseif action == "pan" then "camera-pan"\n\t\telseif action == "zoom" then "camera-zoom"\n\t\telse nil\n'''
          if acceptance.count(old_acceptance) != 1:
              raise SystemExit("acceptance format target mismatch")
          acceptance_path.write_text(acceptance.replace(old_acceptance, new_acceptance, 1), encoding="utf-8")
          PY

      - name: Commit formatting and remove workflow
        shell: bash
        run: |
          git config user.name "Kaetaeru"
          git config user.email "131461278+Kaetaeru@users.noreply.github.com"
          git rm .github/workflows/format-wasd-camera-acceptance.yml
          git add implementation/roblox/src/StarterPlayer/StarterPlayerScripts/RVTT/Client/World/WorldCameraController.lua
          git add implementation/roblox/tests/WorldTokenAcceptance/WorldTokenAcceptance.client.lua
          git commit -m "style: format WASD camera acceptance"
          git push origin HEAD:planning/rvtt-remake
