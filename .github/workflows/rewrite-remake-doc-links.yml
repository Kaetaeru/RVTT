name: Rewrite remake documentation links

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - name: Check out planning branch
        uses: actions/checkout@v4
        with:
          ref: planning/rvtt-remake

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rewrite migrated relative links
        run: python scripts/docs/rewrite_remake_doc_links.py

      - name: Commit rewritten links
        run: |
          if git diff --quiet; then
            echo "No link rewrites required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/remake
          git commit -m "docs: rewrite migrated documentation links"
          git push origin HEAD:planning/rvtt-remake
