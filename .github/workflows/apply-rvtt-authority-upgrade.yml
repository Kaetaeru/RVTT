name: Apply RVTT authority upgrade

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/apply-rvtt-authority-upgrade.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out planning branch
        uses: actions/checkout@v4
        with:
          ref: planning/rvtt-remake
          fetch-depth: 0

      - name: Skip an already applied upgrade
        id: state
        shell: bash
        run: |
          if test -f implementation/roblox/.upgrade-v2-complete; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble and extract authority upgrade
        if: steps.state.outputs.applied != 'true'
        shell: bash
        run: |
          cat > /tmp/rvtt_chunks.sha256 <<'SUMS'
          c4663f7ddb4d416a6c6ca463fab23948af812b9e31b1b9716c617a8153f09c31  .github/rvtt-upgrade/correct-00-0.b64
          78bb396512f7bd1eeb0d5a442bba46f31cd87a3b9e7211698aff301cd5597784  .github/rvtt-upgrade/correct-00-1.b64
          8b023edfa8d3eeb00d3274de2a23d20a97f763e99814002e5517894ad86b3d92  .github/rvtt-upgrade/part-01.b64
          321925a1f14330d7a0c13677d86ba9b2aba415f2d2d0affadcbfce7585e58c9e  .github/rvtt-upgrade/correct-02-0.b64
          93c80eab812e7360c43d912e4ac8d910a0548f931e2b4e1a85163ff828021443  .github/rvtt-upgrade/correct-02-1.b64
          a886fccf612d3035680970f88aeecd1464508e157a060da03456f2790a9cef5c  .github/rvtt-upgrade/part-03.b64
          1fc2ed26bba76180bee6c7292924efe35fadb5326b8e315aae43f8bd159f0dff  .github/rvtt-upgrade/part-04.b64
          ff65fec24f9f01ddfd410abf76d80be93fe6ca90aa561629c970e0177b2530e0  .github/rvtt-upgrade/part-05.b64
          0b90ad4219a412524599eede3a31ef539c086326ae400784e78f2f40836b93d0  .github/rvtt-upgrade/part-06.b64
          SUMS
          sha256sum --check /tmp/rvtt_chunks.sha256
          cat \
            .github/rvtt-upgrade/correct-00-0.b64 \
            .github/rvtt-upgrade/correct-00-1.b64 \
            .github/rvtt-upgrade/part-01.b64 \
            .github/rvtt-upgrade/correct-02-0.b64 \
            .github/rvtt-upgrade/correct-02-1.b64 \
            .github/rvtt-upgrade/part-03.b64 \
            .github/rvtt-upgrade/part-04.b64 \
            .github/rvtt-upgrade/part-05.b64 \
            .github/rvtt-upgrade/part-06.b64 \
            > /tmp/rvtt_upgrade.b64
          base64 --decode /tmp/rvtt_upgrade.b64 > /tmp/rvtt_upgrade.tar.gz
          echo "7be12657b6932f1eabb46e1a6e8fbe6808d3cce0cab27e63bbfd286e61fe4c45  /tmp/rvtt_upgrade.tar.gz" | sha256sum --check
          tar -xzf /tmp/rvtt_upgrade.tar.gz -C "$GITHUB_WORKSPACE"

      - name: Validate upgraded implementation
        if: steps.state.outputs.applied != 'true'
        run: python implementation/roblox/tooling/validate_implementation.py

      - name: Commit authority upgrade
        if: steps.state.outputs.applied != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add implementation/roblox docs/remake/audits/all-slice-script-transfer-audit.md
          if git diff --cached --quiet; then
            echo "Authority upgrade already matches the branch."
            exit 0
          fi
          git commit -m "fix: enforce authority across all RVTT slices"
          git push origin HEAD:planning/rvtt-remake
