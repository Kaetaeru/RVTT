name: Fix Slice 01 Types Once

on:
  push:
    branches:
      - planning/rvtt-remake
    paths:
      - ".github/workflows/fix-slice01-types-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out planning branch
        uses: actions/checkout@v4
        with:
          ref: planning/rvtt-remake

      - name: Apply focused type-boundary fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path("implementation/roblox/tests/Slice01Acceptance/Slice01Acceptance.client.lua")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'local ClientRuntime = require(clientFolder:WaitForChild("ClientRuntime"))',
              'local ClientRuntime = (require :: any)(clientFolder:WaitForChild("ClientRuntime"))',
          )
          text = text.replace(
              'local succeeded, failure = xpcall(action, debug.traceback)\n\tbusy = false\n\tif not succeeded then\n\t\tsetOperation("Harness 오류: " .. tostring(failure), true)\n\tend',
              'local succeeded = xpcall(action, debug.traceback)\n\tbusy = false\n\tif not succeeded then\n\t\tsetOperation("Harness 작업 실행 실패", true)\n\tend',
          )
          path.write_text(text, encoding="utf-8")

      - name: Verify replacements and commit
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'local ClientRuntime = (require :: any)' implementation/roblox/tests/Slice01Acceptance/Slice01Acceptance.client.lua
          grep -Fq 'local succeeded = xpcall(action, debug.traceback)' implementation/roblox/tests/Slice01Acceptance/Slice01Acceptance.client.lua
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add implementation/roblox/tests/Slice01Acceptance/Slice01Acceptance.client.lua
          git commit -m "fix: type Slice 01 acceptance harness"
          git push origin HEAD:planning/rvtt-remake
