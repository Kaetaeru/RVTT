name: Fix production lease meta type

on:
  push:
    branches:
      - planning/rvtt-remake
    paths:
      - ".github/workflows/fix-production-lease-meta-type.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: planning/rvtt-remake
          fetch-depth: 0

      - name: Apply typed diagnostic details
        shell: python
        run: |
          from pathlib import Path

          path = Path("implementation/roblox/src/ServerScriptService/RVTT/ServerBoot.server.lua")
          text = path.read_text(encoding="utf-8")
          old = '''\t\t\tif not ok then
          \t\t\t\tdiagnostics:record("error", "PRODUCTION_LEASE_ACCEPTANCE_META_SAVE_FAILED", {
          \t\t\t\t\treason = tostring(failure),
          \t\t\t\t})
          \t\t\tend'''
          new = '''\t\t\tif not ok then
          \t\t\t\tlocal details: { [string]: unknown } = {
          \t\t\t\t\treason = tostring(failure),
          \t\t\t\t}
          \t\t\t\tdiagnostics:record("error", "PRODUCTION_LEASE_ACCEPTANCE_META_SAVE_FAILED", details)
          \t\t\tend'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one target, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")

      - name: Format changed file
        shell: bash
        run: |
          if ! command -v stylua >/dev/null 2>&1; then
            cargo install stylua --version 2.5.2 --features luau --locked
          fi
          stylua implementation/roblox/src/ServerScriptService/RVTT/ServerBoot.server.lua

      - name: Commit type fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add implementation/roblox/src/ServerScriptService/RVTT/ServerBoot.server.lua
          git commit -m "fix production lease acceptance diagnostic type"
          git pull --rebase origin planning/rvtt-remake
          git push origin HEAD:planning/rvtt-remake
