name: Format world interaction batch

on:
  push:
    branches:
      - planning/rvtt-remake
    paths:
      - .github/workflows/format-world-interaction-batch.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: planning/rvtt-remake
          fetch-depth: 0
      - name: Install pinned StyLua
        shell: bash
        run: |
          set -euo pipefail
          cargo install stylua --version 2.5.2 --features luau --locked
      - name: Format and publish
        shell: bash
        run: |
          set -euo pipefail
          cd implementation/roblox
          stylua src tests
          cd ../..
          rm -f .github/workflows/format-world-interaction-batch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format world interaction batch"
          git push origin HEAD:planning/rvtt-remake
