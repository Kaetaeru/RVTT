  <div class="guide-shell">
    <aside class="guide-sidebar">
      <div class="brand-block">
        <div class="brand-mark">RV</div>
        <div><p>RVTT PRODUCT UI</p><h1>고정밀 제작 가이드</h1></div>
      </div>
      <p class="guide-intro">Runtime 화면 26개와 제작 기준 화면 2개. 1920×1080 기준 토큰·상태·레이어·입력을 Roblox UI 구현에 직접 사용합니다.</p>
      <div class="guide-status"><strong>HIGH-FIDELITY TARGET</strong><span>정적 프로토타입 · Runtime Evidence 아님</span></div>
      <nav id="screenNav" aria-label="UI 화면 목록"></nav>
    </aside>

    <main class="guide-main">
      <header class="guide-toolbar">
        <label>Accent<select id="accentSelect"><option value="gold">Gold</option><option value="azure">Azure</option><option value="emerald">Emerald</option><option value="amethyst">Amethyst</option><option value="teal">Teal</option><option value="silver">Silver</option></select></label>
        <label>Viewport<select id="viewportSelect"><option value="16:9">1920 × 1080</option><option value="compact">1440 × 900</option><option value="wide">2560 × 1080</option></select></label>
        <label>UI Scale<select id="uiScaleSelect"><option value="0.8">0.80</option><option value="1" selected>1.00</option><option value="1.2">1.20</option><option value="1.4">1.40</option></select></label>
        <label>Text Scale<select id="textScaleSelect"><option value="0.9">0.90</option><option value="1" selected>1.00</option><option value="1.15">1.15</option><option value="1.3">1.30</option></select></label>
        <div class="toolbar-spacer"></div>
        <button id="motionButton" class="guide-button" type="button">Motion · Full</button>
        <button id="gridButton" class="guide-button" type="button">Grid · Off</button>
        <a class="guide-button" href="../README.md">User Guide Hub</a>
      </header>

      <section class="screen-heading">
        <div><p id="screenEyebrow"></p><h2 id="screenTitle"></h2><p id="screenDescription"></p></div>
        <div id="screenBadges" class="screen-badges"></div>
      </section>

      <section class="stage-viewport" aria-label="RVTT UI 화면 예시">
        <div id="stageScaler" class="stage-scaler">
          <div id="rvttStage" class="rvtt-stage" tabindex="-1" aria-live="polite"></div>
        </div>
      </section>

      <section class="implementation-panel">
        <article><h3>레이아웃 규격</h3><div id="layoutMetrics" class="spec-list"></div></article>
        <article><h3>입력·상태</h3><div id="interactionSpec" class="spec-list"></div></article>
        <article><h3>구현 Acceptance</h3><div id="acceptanceSpec" class="spec-list"></div></article>
      </section>
    </main>
